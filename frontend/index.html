<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CaseConnect — Centralized Institution Complaint & Regulatory Monitoring Platform</title>
  <meta name="description" content="Centralized regulatory monitoring and cross-bureau complaint case tracking platform for technical education institutions." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%234f46e5'><path d='M12 2L3 7v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V7l-9-5zm0 4.5l5 2.8v4.2c0 3.3-2.1 6.4-5 7.4-2.9-1-5-4.1-5-7.4V9.3l5-2.8z'/></svg>" />

  <!-- Tailwind CSS CDN for utility classes -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eef2ff',
              100: '#e0e7ff',
              500: '#6366f1',
              600: '#4f46e5',
              700: '#4338ca',
              800: '#3730a3',
              900: '#312e81',
            }
          }
        }
      }
    }
  </script>

  <!-- Google Fonts: Inter, Plus Jakarta Sans, JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Instant Theme Loader (Prevents White Flashes on Refresh) -->
  <script>
    (function() {
      const saved = localStorage.getItem('caseconnect_theme');
      if (saved === 'dark' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.setAttribute('data-theme', 'dark');
      } else {
        document.documentElement.setAttribute('data-theme', 'light');
      }
    })();
  </script>

  <!-- CampusX-Inspired Enterprise Stylesheet -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

  <!-- Top Application Header Bar (Fixed / Sticky) -->
  <header class="header" id="appHeader"></header>

  <!-- Main App Layout: Sidebar + Content Area -->
  <div class="app-layout">
    <!-- Collapsible / Fixed Navigation Sidebar -->
    <aside class="sidebar" id="appSidebar" style="display: none;"></aside>

    <!-- Main Dynamic Content Workspace -->
    <main class="main-content" id="mainContentArea">
      <div style="text-align: center; padding: 4rem 1rem; color: #64748b;">
        Initializing CaseConnect Platform...
      </div>
    </main>
  </div>

  <!-- Global Modal Mount Point -->
  <div id="globalModalWrapper"></div>

  <!-- Toast Notification Mount Point -->
  <div id="toastContainer" class="toast-container"></div>

  <!-- Application Scripts in Dependency Order -->
  <script src="js/config.js"></script>
  <script src="js/theme.js"></script>
  <script src="js/components/icons.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/components/toast.js"></script>
  <script src="js/components/header.js"></script>
  <script src="js/components/sidebar.js"></script>
  <script src="js/components/modals.js"></script>

  <!-- Page Components -->
  <script src="js/pages/login.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/cases.js"></script>
  <script src="js/pages/caseDetails.js"></script>
  <script src="js/pages/institutions.js"></script>
  <script src="js/pages/institutionProfile.js"></script>
  <script src="js/pages/bureaus.js"></script>
  <script src="js/pages/workload.js"></script>
  <script src="js/pages/overlaps.js"></script>
  <script src="js/pages/pendingOverdue.js"></script>
  <script src="js/pages/notifications.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/pages/users.js"></script>
  <script src="js/pages/roles.js"></script>
  <script src="js/pages/workflowConfig.js"></script>
  <script src="js/pages/auditLogs.js"></script>
  <script src="js/pages/settings.js"></script>
  <script src="js/pages/notFound.js"></script>

  <!-- Router and Bootstrapper -->
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
